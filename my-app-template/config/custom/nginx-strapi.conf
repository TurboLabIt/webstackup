## 🚨 WARNING 🚨
#
# This file is under version control!
# DO NOT EDIT DIRECTLY - If you do, you'll lose your changes!
#
# The original file is in `/var/www/my-app/config/custom/`
#
# You MUST:
#
# 1. edit the original file on your PC
# 2. Git-commit+push the changes
# 3. run `sudo bash /var/www/my-app/scripts/deploy.sh`
#
# ⚠️ This file is SHARED among dev|staging|prod ⚠️
#
# 🪄 Based on https://github.com/TurboLabIt/webstackup/blob/master/my-app-template/config/custom/nginx-strapi.conf

set $APP_NAME my-app;

## 🌎 public webroot ("htdocs")
root $PROJECT_DIR/public;

## 🧰 Maintenace - To enable/disable, run:
# https://github.com/TurboLabIt/webstackup/blob/master/my-app-template/scripts/maintenance.sh
include /usr/local/turbolab.it/webstackup/config/nginx/06_maintenace.conf;

## 🛣 Redirect map
if ($wsuRedirectToMap_my-app) {
  return 301 $wsuRedirectToMap_my-app;
}

## 🛡️ Extra-security (requires a valid HTTPS certificate)
# https://github.com/TurboLabIt/webstackup/blob/master/config/nginx/70_security.conf
#include /usr/local/turbolab.it/webstackup/config/nginx/70_security.conf;

## 🖼️ Frontend
# https://github.com/TurboLabIt/webstackup/tree/master/config/nginx
include /usr/local/turbolab.it/webstackup/config/nginx/50_compression.conf;
include /usr/local/turbolab.it/webstackup/config/nginx/90_rate-limit.conf;

## ⏱️ The admin panel runs long requests (media processing, data import/export): the Nginx default (60s) is not enough
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# ⚠️ Keep this port in sync with the Node server's PORT (NODEJS_PORT in scripts/script_begin.sh, PORT in .env): my-app-template
# sets all of them from the same value (WSU_MAP_NODEJS_PORT, default 1337 = Strapi's own default). To use another one, change all of them.
# This file is SHARED across dev|staging|prod; for a per-env port, set $proxy_pass_target
# in each per-env server block instead (the same way $PROJECT_DIR is set there).
set $proxy_pass_target http://127.0.0.1:my-app-node-port;
include /usr/local/turbolab.it/webstackup/config/nginx/25_reverse-proxy.conf;

## 🏃‍♂️ Async runner (requires a related cron job)
# https://github.com/TurboLabIt/webstackup/blob/master/config/nginx/45_async-runner-request.conf
#include /usr/local/turbolab.it/webstackup/config/nginx/45_async-runner-request.conf;

## 📃 Logging
error_log /var/log/nginx/my-app_error.log;
access_log /var/log/nginx/my-app_access.log;
