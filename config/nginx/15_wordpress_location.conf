## WORDPRESS LOCATION BY WEBSTACKUP
# Activates WordPress default location (required)
#
# - https://www.nginx.com/resources/wiki/start/topics/recipes/wordpress/
# - https://wordpress.org/support/article/nginx/

location / {
    # This is cool because no php is touched for static content.
    # include the "$is_args$args" so non-default permalinks doesn't break when using query string
    try_files $uri $uri/ /index.php$is_args$args;
}


## WordPress core files that disclose WordPress and its version
# Deleting them is not enough: core updates restore them
location = /readme.html {
    deny all;
    return 404;
}

location = /license.txt {
    deny all;
    return 404;
}

# Blogroll OPML export of the Link Manager (disabled by default since WordPress 3.5): it prints the WordPress version
location = /wp-links-opml.php {
    deny all;
    return 404;
}

# Sample configuration file
location = /wp-config-sample.php {
    deny all;
    return 404;
}

# Database repair page: it works only with WP_ALLOW_REPAIR, but it prints the WordPress version anyway
location = /wp-admin/maint/repair.php {
    deny all;
    return 404;
}


## Plugin and theme docs, manifests and translation templates: they disclose the exact versions (readme.txt "Stable tag")
# .txt/.html files are matched by name, so plugin files such as WebP Express "wod/ping.txt" keep working
location ~* ^/wp-content/(?:plugins|themes)/.+\.(?:md|lock|pot?|mo)$ {
    deny all;
    return 404;
}

location ~* ^/wp-content/(?:plugins|themes)/.+/(?:readme|changelog|changes|license|licence|copying)[^/]*\.(?:txt|html?)$ {
    deny all;
    return 404;
}

location ~* ^/wp-content/(?:plugins|themes)/.+/(?:composer\.json|package(?:-lock)?\.json)$ {
    deny all;
    return 404;
}


## WordPress User enumeration blocking author query string
if ($args ~* "^author=([0-9]+|{num:[0-9]+)") {
    return 403;
}

## WordPress User Enumeration author page pretty link
if ($request_uri ~ "/author/") {
    return 403;
}

## Block user enumeration sitemap - note that this covers the unicode version of - as %2d
if ($request_uri ~ "wp-sitemap-users-[0-9]+.xml") {
    return 403;
}


