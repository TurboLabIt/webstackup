## RESTRICT WORDPRESS API ACCESS BY WEBSTACKUP
#

# exception for Nexi (payments)
location ~ ^/wp-json/woocommerce-gateway-nexi-xpay/s2s/ {
  try_files $uri $uri/ /index.php$is_args$args;
}

# exception for Contact Form 7
location /wp-json/contact-form-7/ {
  try_files $uri $uri/ /index.php$is_args$args;
}

# exception for Rankmath
location /wp-json/rankmath/ {
  try_files $uri $uri/ /index.php$is_args$args;
}

# exception for HubSpot (leadin): short-lived access token for the plugin admin UI, requires edit_posts (anonymous gets 401)
location = /wp-json/leadin/v1/access-token {
  try_files $uri $uri/ /index.php$is_args$args;
}

# exception for the logged-in user: block editor preferences (GET ?context=edit&_locale=user, PUT to save)
# exact match only: WordPress answers 401 to anonymous requests here, /wp-json/wp/v2/users stays restricted
location = /wp-json/wp/v2/users/me {
  try_files $uri $uri/ /index.php$is_args$args;
}

## REST API
# ⚠ Incompatible with Elementor
# Test: http://example.com/wp-json/wp/v2/users
# https://wordpress.org/support/topic/why-is-the-rest-api-enabled-by-default/
location /wp-json/ {

  satisfy any;

  ## https://github.com/TurboLabIt/webstackup/blob/master/config/nginx/whitelist-ip.conf
  include /usr/local/turbolab.it/webstackup/config/nginx/whitelist-ip.conf;

  deny all;
  try_files $uri $uri/ /index.php$is_args$args;
}

## XML-RPC
# Test: curl -X POST -H 'Cache-Control: no-cache' -H 'Content-Type: application/xml' -d '<methodCall><methodName>system.listMethods</methodName></methodCall>' https://example.com/xmlrpc.php
location = /xmlrpc.php {

  satisfy any;

  ## https://github.com/TurboLabIt/webstackup/blob/master/config/nginx/whitelist-ip.conf
  include /usr/local/turbolab.it/webstackup/config/nginx/whitelist-ip.conf;

  deny all;
  try_files $uri $uri/ /xmlrpc.php$is_args$args;
}
