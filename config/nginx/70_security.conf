## EXTRASECURITY BY WEBSTACKUP
# Various tricks to (mildly) increase security.

## Bad bots — default list in config/nginx/02_global_http_level.conf (map $http_user_agent $wsuBadBots)
# Per-vhost override: set $wsuBadBots (+ optional custom if/set list) BEFORE including this file
if ($wsuBadBots) { return 403; }

## HSTS (requires a valid HTTPS certificate)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

## Deny all attempts to access hidden files such as .htaccess, .htpasswd, .DS_Store (Mac) excepted .well-known directory.
# Keep logging the requests to parse later (or to pass to firewall utilities such as fail2ban)
location ~ /\.(?!well-known\/) {
  deny all;
  return 404;
}

## Deny access to any files with a .php extension in the uploads directory for the single site
location /wp-content/uploads {
  location ~ \.php$ {
    return 403;
  }
}

## WordPress plugin private folders: their plugins protect them only with .htaccess, which nginx ignores.
# ^~ wins over the uploads location above and over the regex locations; the bare folder URL gets 404 too
# WooCommerce logs (payments, fatal errors)
location ^~ /wp-content/uploads/wc-logs {
  deny all;
  return 404;
}

# WooCommerce transient files (served through PHP at /wc/file/transient/)
location ^~ /wp-content/uploads/woocommerce_transient_files {
  deny all;
  return 404;
}

# Contact Form 7 temporary uploads
location ^~ /wp-content/uploads/wpcf7_uploads {
  deny all;
  return 404;
}

# WebToffee import/export folders and logs
location ^~ /wp-content/webtoffee_ {
  deny all;
  return 404;
}

# WPML translation cache and job logs
location ^~ /wp-content/languages/wpml {
  deny all;
  return 404;
}

## WooCommerce downloadable products: reachable only through an internal redirect (X-Accel-Redirect download method),
# external requests get 404. The "Redirect only" download method doesn't work (WooCommerce itself flags it as insecure)
location ^~ /wp-content/uploads/woocommerce_uploads {
  internal;
}

## Abandoned WooCommerce CSV exports (the actual download goes through PHP)
location ~ ^/wp-content/uploads/wc-[a-z-]+-export-[^/]*\.csv(?:\.headers)?$ {
  deny all;
  return 404;
}

## Log files (debug.log, plugin logs) and MaxMind GeoIP databases (read from disk by the plugins, large downloads)
location ~* \.(?:log|mmdb)$ {
  deny all;
  return 404;
}

## Disallow embedding of this site. All iframes etc. will be blank, or contain a browser specific error page.
# https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors
# we CANNOT be stricter: it would break scripts loaded via CDN or Tag Managers
add_header Content-Security-Policy "frame-ancestors 'self'" always;

## Disable embedding in SWFs (Flash) and PDFs
# It has almost no effect on modern web standards, but it is often included in "checklist" security audits.
add_header X-Permitted-Cross-Domain-Policies "none" always;

## Prevents an attacker from iframing the content of your site into others.
# https://docs.sucuri.net/warnings/hardening/security-headers-x-frame-options/
add_header X-Frame-Options "SAMEORIGIN" always;

## Prevent the browser from guessing the file type
add_header X-Content-Type-Options "nosniff" always;

## Send the full referrer when browsing internally. Just the domain otherwise
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

## Force all the cookies set to be HTTPOnly (no-JS) and HTTPS-only (no-HTTP)
# https://www.php.net/manual/en/function.setcookie
proxy_cookie_path / "/; HTTPOnly; Secure";

location ~* ^/(wp-config.php|.htaccess) {
  return 403;
}
